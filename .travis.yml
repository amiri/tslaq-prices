dist: xenial
language: generic
cache:
  directories:
  - "$HOME/.stack"
addons:
  apt:
    packages:
    - libgmp-dev
before_install:
- mkdir -p ~/.local/bin
- export PATH=$HOME/.local/bin:$PATH
- travis_retry curl -L https://get.haskellstack.org/stable/linux-x86_64.tar.gz | tar
  xz --wildcards --strip-components=1 -C ~/.local/bin '*/stack'
install:
- stack --no-terminal --install-ghc test --only-dependencies
script:
- stack --no-terminal test --haddock --no-haddock-deps
deploy:
- provider: s3
  access_key_id: $ACCESS_KEY_ID
  secret_access_key:
    secure: 
  skip_cleanup: true
  bucket: tslaq-deployments
  upload-dir: tslaq-prices
  key: $TRAVIS_COMMIT
  acl: private
  on:
    repo: amiri/tslaq-prices
- provider: codedeploy
  access_key_id: $ACCESS_KEY_ID
  secret_access_key:
    secure: 
  bucket: "tslaq-deployments"
  upload-dir: tslaq-prices
  key: $TRAVIS_COMMIT
  application: tslaq-prices
  deployment_group: tslaq
  wait_until_deployed: true
